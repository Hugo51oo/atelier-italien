      el.querySelector("#scene").classList.toggle("nascosto", nascondi);
    });
  }

  /* ---------------- IV. Cultura ---------------- */

  function renderCultura(){
    const el = document.getElementById("view-cultura");
    el.innerHTML =
      testata("cultura", "Six entrées pour <em>comprendre le pays</em>",
        "Le fil culturel porte le vocabulaire : chaque article finit sur les mots qu'il rend nécessaires.") +
      `<div class="articoli">
        ${CULTURA.map((c,i)=>`
          <article class="articolo">
            <span class="etichetta">${esc(c.sotto)}</span>
            <h3 style="font-size:26px; margin:6px 0 10px">${esc(c.titolo)}</h3>
            <p class="testo">${esc(c.testo)}</p>
            <div class="termini">${c.termini.map(t=>`<span class="termine"${VOCE.disponibile?` data-dire="${esc(t)}" role="button" tabindex="0" title="Écouter en italien"`:""}>${esc(t)}</span>`).join("")}</div>
            ${veroFalso(i)}
          </article>`).join("")}
      </div>`;
  }

  /* ---------------- V. L'Italia ---------------- */

  let epocaScelta = "tutte";
  let capitolo = "cronologia";

  function renderStoria(){
    const el = document.getElementById("view-storia");
    el.innerHTML =
      testata("storia", "L'Italie, <em>en quatre mouvements</em>",
        "Une nation vieille de 165 ans sur un pays vieux de vingt siècles : d'où viennent la langue, les inventions et les fractures qu'on entend dans les conversations d'aujourd'hui.") +
      `<div class="barra-filtri" id="capitoli"><span class="etichetta">Chapitre</span>
        <button class="gettone" type="button" data-cap="cronologia">Cronologia</button>
        <button class="gettone" type="button" data-cap="invenzioni">Invenzioni</button>
        <button class="gettone" type="button" data-cap="lingua">La lingua</button>
        <button class="gettone" type="button" data-cap="societa">La società oggi</button>
      </div>
      <div id="capitolo"></div>`;
    el.querySelector("#capitoli").addEventListener("click", e=>{
      const b = e.target.closest("[data-cap]"); if(!b) return;
      capitolo = b.dataset.cap; segnaCap(); disegnaCap();
    });
    segnaCap(); disegnaCap();

    function segnaCap(){
      el.querySelectorAll("[data-cap]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.cap===capitolo)));
    }
    function disegnaCap(){
      const box = el.querySelector("#capitolo");
      if(capitolo==="cronologia") box.innerHTML = htmlCronologia();
      else if(capitolo==="invenzioni") box.innerHTML = htmlInvenzioni();
      else if(capitolo==="lingua") box.innerHTML = htmlLingua();
      else box.innerHTML = htmlSocieta();
      const filtri = box.querySelector("#epoche");
      if(filtri) filtri.addEventListener("click", e=>{
        const b = e.target.closest("[data-epoca]"); if(!b) return;
        epocaScelta = b.dataset.epoca; disegnaCap();
      });
    }
  }

  function htmlCronologia(){
    const righe = CRONOLOGIA.filter(r=>epocaScelta==="tutte" || r.epoca===epocaScelta);
    const epoche = [{id:"tutte", nome:"Tout", fr:""}].concat(EPOCHE);
    return `
      <div class="barra-filtri" id="epoche"><span class="etichetta">Époque</span>
        ${epoche.map(e=>`<button class="gettone" type="button" data-epoca="${e.id}" aria-pressed="${epocaScelta===e.id}">${esc(e.nome)}</button>`).join("")}
      </div>
      <div class="linea">
        ${righe.map(r=>`
          <div class="tappa">
            <div class="anno">${esc(r.anno)}</div>
            <div class="fatto">
              <h3>${esc(r.titolo)}</h3>
              <p style="margin:0">${esc(r.testo)}</p>
            </div>
          </div>`).join("")}
      </div>
      ${giocoEpoca()}`;
  }

  function htmlInvenzioni(){
    return `
      <p class="occhiello" style="margin-bottom:24px">Douze objets et méthodes partis d'Italie. Le vocabulaire suit : ce que le monde a emprunté, il l'a souvent emprunté avec son nom italien.</p>
      <div class="invenzioni">
        ${INVENZIONI.map(i=>`
          <article class="scheda invenzione">
            <span class="etichetta">${esc(i.quando)} — ${esc(i.chi)}</span>
            <h3 style="font-size:26px; margin:8px 0 2px">${esc(i.cosa)}</h3>
            <p class="occhiello" style="font-size:16px; margin:0 0 10px">${esc(i.fr)}</p>
            <p style="margin:0; font-size:17px">${esc(i.testo)}</p>
          </article>`).join("")}
      </div>
      ${giocoMiti()}`;
  }

  function htmlLingua(){
    return `
      <div class="due-colonne">
        <div class="prosa">${LINGUA.testi.map((t,i)=>`<p${i===0?' class="testo"':''}>${t}</p>`).join("")}</div>
        <aside class="margine">
          <span class="etichetta">Quatre dates</span>
          ${LINGUA.fatti.map(f=>`<div class="cifra-voce"><b>${esc(f.cifra)}</b><span>${esc(f.nota)}</span></div>`).join("")}
          <span class="etichetta" style="margin-top:22px; display:block">Ce que le monde a emprunté</span>
          <div class="termini" style="margin-top:10px">${LINGUA.prestiti.map(p=>`<span class="termine"${VOCE.disponibile?` data-dire="${esc(p)}" role="button" tabindex="0" title="Écouter en italien"`:""}>${esc(p)}</span>`).join("")}</div>
        </aside>
      </div>`;
  }

  function htmlSocieta(){
    return `
      <div class="cifre">
        ${SOCIETA.cifre.map(c=>`<div class="cifra-grande"><b>${esc(c.cifra)}</b><span>${esc(c.nota)}</span></div>`).join("")}
      </div>
      <div class="due-colonne" style="margin-top:34px">
        <div class="prosa">${SOCIETA.testi.map((t,i)=>`<p${i===0?' class="testo"':''}>${t}</p>`).join("")}</div>
        <aside class="margine">
          <span class="etichetta">Le lexique du débat</span>
          <div class="termini" style="margin-top:10px">
            <span class="termine">la denatalità</span><span class="termine">il divario</span>
            <span class="termine">il distretto industriale</span><span class="termine">il precariato</span>
            <span class="termine">la fuga dei cervelli</span><span class="termine">il Mezzogiorno</span>
          </div>
          <p class="occhiello" style="font-size:15px; margin-top:18px">Chiffres : ordres de grandeur des dernières publications de l'Istat et de l'UNESCO — à revérifier avant de les citer dans un devoir.</p>
        </aside>
      </div>
      ${giocoIndovina()}`;
  }

  /* ---------------- VI. Esercizi ---------------- */

  let modo = "lessico";

  function renderEsercizi(){
    const el = document.getElementById("view-esercizi");
    el.innerHTML =
      testata("esercizi", "S'entraîner <em>sur ses propres mots</em>",
        "Trois exercices tirés des mêmes données que les sections précédentes — y compris les mots que tu as ajoutés.") +
      `<div class="barra-filtri" id="modi"><span class="etichetta">Exercice</span>
        <button class="gettone" type="button" data-modo="lessico">Traduction</button>
        <button class="gettone" type="button" data-modo="coniug">Conjugaison</button>
        <button class="gettone" type="button" data-modo="frasi">Remise en ordre</button>
      </div>
      <div class="banco">
        <div class="prova" id="prova"></div>
        <div class="conti" id="conti"></div>
      </div>`;
    el.querySelector("#modi").addEventListener("click", e=>{
      const b = e.target.closest("[data-modo]"); if(!b) return;
      modo = b.dataset.modo; segna(); nuovo();
    });
    segna(); conti(); nuovo();

    function segna(){
      el.querySelectorAll("[data-modo]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.modo===modo)));
    }
  }

  function conti(){
    const s = state.stats;
    const box = document.getElementById("conti"); if(!box) return;
    box.innerHTML = `
      <div class="conto-voce"><b>${s.lessico[0]}/${s.lessico[1]}</b><span>Traduction</span></div>
      <div class="conto-voce"><b>${s.coniug[0]}/${s.coniug[1]}</b><span>Conjugaison</span></div>
      <div class="conto-voce"><b>${s.frasi[0]}/${s.frasi[1]}</b><span>Phrases</span></div>
      <button class="bottone vuoto" type="button" id="azzera" style="margin-left:auto">Remettre à zéro</button>`;
    box.querySelector("#azzera").addEventListener("click", ()=>{
      state.stats = {lessico:[0,0], coniug:[0,0], frasi:[0,0]}; save(); conti(); aggiornaRail();
    });
  }

  function prova(){ return document.getElementById("prova"); }
  function punto(chiave, giusto){
    state.stats[chiave][1]++; if(giusto) state.stats[chiave][0]++;
    save(); conti(); aggiornaRail();
  }
  function nuovo(){
    prova().dataset.done = "";
    if(modo==="lessico") esLessico();
    else if(modo==="coniug") esConiug();
    else esFrasi();
  }
  function avanti(){
    const b = document.createElement("button");
    b.className = "bottone"; b.type = "button"; b.textContent = "Suivant";
    b.style.alignSelf = "flex-start";
    b.addEventListener("click", nuovo);
    prova().appendChild(b);
    b.focus();
  }

  function esLessico(){
    const parole = tutteLeParole();
    if(parole.length < 4){
      prova().innerHTML = `<p class="occhiello">Il faut au moins quatre mots actifs. Retourne au <b>Lessico</b> et allume un domaine.</p>`;
      return;
    }
    const versoIt = Math.random() < 0.5;
    const giusta = rnd(parole);
    const altre = shuffle(parole.filter(p=>p.it!==giusta.it)).slice(0,3);
    const scelte = shuffle(altre.concat([giusta]));
    prova().innerHTML = `
      <span class="consegna">${versoIt ? "Comment dit-on en italien ?" : "Que signifie ce mot ?"}</span>
      <p class="domanda">${esc(versoIt ? giusta.fr : giusta.it)}</p>
      <span class="etichetta">${esc(giusta.tema)}</span>
      <div class="scelte" id="scelte">${scelte.map(c=>`<button class="scelta" type="button" data-it="${esc(c.it)}">${esc(versoIt ? c.it : c.fr)}</button>`).join("")}</div>
      <p class="verdetto" id="fb"></p>`;
    prova().querySelector("#scelte").addEventListener("click", e=>{
      const b = e.target.closest(".scelta"); if(!b || prova().dataset.done) return;
      prova().dataset.done = "1";
      const giusto = b.dataset.it === giusta.it;
      prova().querySelectorAll(".scelta").forEach(o=>{
        if(o.dataset.it === giusta.it) o.classList.add("giusta");
        else if(o===b) o.classList.add("sbagliata");
      });
      const fb = prova().querySelector("#fb");
      fb.className = "verdetto " + (giusto ? "si" : "no");
      fb.innerHTML = `<b>${giusto ? "Giusto." : "Sbagliato."}</b> ${esc(giusta.it)}${VOCE.disponibile ? dire(giusta.it) : ""} — ${esc(giusta.fr)}${giusta.nota ? " · <i>"+esc(giusta.nota)+"</i>" : ""}`;
      parla(giusta.it);
      punto("lessico", giusto);
      avanti();
    });
  }

  function esConiug(){
    const v = rnd(VERBI);
    const t = rnd(TEMPI);
    const pi = Math.floor(Math.random()*6);
    const forma = v[t.id][pi];
    prova().innerHTML = `
      <span class="consegna">${esc(t.nome)} — ${esc(t.fr)}</span>
      <p class="domanda">${esc(v.inf)} <em>· ${esc(PERSONE[pi])}</em></p>
      <span class="etichetta">${esc(v.fr)}</span>
      <div class="riga" style="margin-top:6px">
        <input type="text" id="risposta" placeholder="ta réponse" autocomplete="off" spellcheck="false" style="flex:1 1 220px">
        <button class="bottone" type="button" id="verifica">Vérifier</button>
      </div>
      <p class="verdetto" id="fb"></p>`;
    const inp = prova().querySelector("#risposta");
    inp.focus();
    const check = ()=>{
      if(prova().dataset.done) return;
      prova().dataset.done = "1";
      const giusto = varianti(forma).includes(norm(inp.value));
      const fb = prova().querySelector("#fb");
      fb.className = "verdetto " + (giusto ? "si" : "no");
      fb.innerHTML = `<b>${giusto ? "Giusto." : "Sbagliato."}</b> ${esc(PERSONE[pi])} ${esc(forma)}${VOCE.disponibile ? dire(forma) : ""}${v.nota ? " · <i>"+esc(v.nota)+"</i>" : ""}`;
      parla(forma);
      punto("coniug", giusto);
      avanti();
    };
    prova().querySelector("#verifica").addEventListener("click", check);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") check(); });
  }

  function esFrasi(){
    const scena = rnd(SCENE);
    const riga = rnd(scena.righe);
    const mescolate = shuffle(riga[1].split(" "));
    prova().innerHTML = `
      <span class="consegna">Remets la phrase dans l'ordre — ${esc(scena.titolo)}</span>
      <p class="domanda" style="font-size:clamp(22px,3.4vw,30px)">${esc(riga[2])}</p>
      <div class="vassoio" id="vassoio"></div>
      <div class="riga" id="serbatoio">${mescolate.map(w=>`<button class="parola" type="button">${esc(w)}</button>`).join("")}</div>
      <div class="riga" style="margin-top:6px">
        <button class="bottone" type="button" id="verifica">Vérifier</button>
        <button class="bottone vuoto" type="button" id="svuota">Effacer</button>
      </div>
      <p class="verdetto" id="fb"></p>`;
    const vassoio = prova().querySelector("#vassoio");
    const serbatoio = prova().querySelector("#serbatoio");
    const scelte = [];
    function disegna(){
      vassoio.innerHTML = scelte.map((w,i)=>`<button class="parola" type="button" data-back="${i}">${esc(w)}</button>`).join("");
    }
    function rimetti(w){
      const nb = document.createElement("button");
      nb.className = "parola"; nb.type = "button"; nb.textContent = w;
      serbatoio.appendChild(nb);
    }
    serbatoio.addEventListener("click", e=>{
      const b = e.target.closest(".parola"); if(!b || prova().dataset.done) return;
      scelte.push(b.textContent); b.remove(); disegna();
    });
    vassoio.addEventListener("click", e=>{
      const b = e.target.closest("[data-back]"); if(!b || prova().dataset.done) return;
      rimetti(scelte.splice(Number(b.dataset.back),1)[0]); disegna();
    });
    prova().querySelector("#svuota").addEventListener("click", ()=>{
      if(prova().dataset.done) return;
      while(scelte.length) rimetti(scelte.pop());
      disegna();
    });
    prova().querySelector("#verifica").addEventListener("click", ()=>{
      if(prova().dataset.done) return;
      prova().dataset.done = "1";
      const giusto = norm(scelte.join(" ")) === norm(riga[1]);
      const fb = prova().querySelector("#fb");
      fb.className = "verdetto " + (giusto ? "si" : "no");
      fb.innerHTML = `<b>${giusto ? "Giusto." : "Sbagliato."}</b> ${esc(riga[1])}${VOCE.disponibile ? dire(riga[1]) : ""}`;
      parla(riga[1]);
      punto("frasi", giusto);
      avanti();
    });
  }

  /* ---------------- avvio ---------------- */
  /* ---------------- il frontespizio ---------------- */

  function copertina(){
    const cover = document.getElementById("frontespizio");
    const apri = ()=>{ cover.hidden = false; document.body.style.overflow = "hidden"; };
    const chiudi = ()=>{
      cover.hidden = true; document.body.style.overflow = "";
      state.entrato = true; save();
      const primo = nav.querySelector("button[aria-current='true']") || nav.querySelector("button");
      if(primo) primo.focus();
    };
    if(!state.entrato) apri();
    document.getElementById("entra").addEventListener("click", chiudi);
    cover.addEventListener("keydown", e=>{ if(e.key==="Escape") chiudi(); });
    const marchio = document.querySelector(".marchio h1");
    if(marchio){
      marchio.style.cursor = "pointer";
      marchio.title = "Revoir la couverture";
      marchio.addEventListener("click", apri);
    }
  }

  preparaVoce();
  ascoltaGiochi();
  copertina();
  go(TABS.some(t=>t.id===state.tab) ? state.tab : "percorso");
})();
</script>
